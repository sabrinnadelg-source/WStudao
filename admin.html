<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  padding:20px;
}

.login-box {
  max-width:300px;
  margin:100px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

input {
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

button {
  padding:8px 12px;
  cursor:pointer;
  border:none;
  border-radius:6px;
}

.card {
  background:#fff;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

.status {
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.pending { background:#fff3cd; }
.paid { background:#d4edda; }
.shipped { background:#cce5ff; }
.cancelled { background:#f8d7da; }

.btn-paid { background:green; color:#fff; }
.btn-ship { background:blue; color:#fff; }
.btn-cancel { background:red; color:#fff; }

.link {
  color:blue;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>🔐 Admin</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div id="painel" style="display:none;">
  <h1>📦 Pedidos</h1>
  <div id="orders"></div>
</div>

<script>
let token = localStorage.getItem("token");

// auto login
if (token) showPanel();

// LOGIN
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });

  if (res.ok) {
    const data = await res.json();
    localStorage.setItem("token", data.token);
    showPanel();
  } else {
    alert("Login inválido");
  }
}

// MOSTRAR PAINEL
function showPanel() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("painel").style.display = "block";
  loadOrders();
}

// CARREGAR PEDIDOS
async function loadOrders() {
  const res = await fetch("http://localhost:3000/orders", {
    headers: {
      Authorization: localStorage.getItem("token")
    }
  });

  const data = await res.json();

  const container = document.getElementById("orders");
  container.innerHTML = "";

  data.reverse().forEach(order => {

    let total = 0;
    let cost = 0;

    order.cart.forEach(i => {
      total += 10 * i.qty;
      cost += (i.cost || 6) * i.qty;
    });

    const lucro = total - cost;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>Pedido:</b> ${order.id}<br>
      <b>Cliente:</b> ${order.customer.nome}<br>
      <b>Endereço:</b> ${order.customer.endereco}<br>

      <b>Status:</b>
      <span class="status ${order.status}">
        ${order.status}
      </span><br><br>

      <b>Total:</b> R$ ${total.toFixed(2)}<br>
      <b>Custo:</b> R$ ${cost.toFixed(2)}<br>
      <b>Lucro:</b> R$ ${lucro.toFixed(2)}<br><br>

      <b>Produtos:</b>
      <ul>
        ${order.cart.map(i => `
          <li>
            ${i.nome} (${i.qty}x)
            <br>
            <a class="link" href="${i.url}" target="_blank">
              🔗 Comprar no fornecedor
            </a>
          </li>
        `).join("")}
      </ul>

      <button class="btn-paid" onclick="updateStatus(${order.id}, 'paid')">
        ✔ Pago
      </button>

      <button class="btn-ship" onclick="updateStatus(${order.id}, 'shipped')">
        📦 Enviado
      </button>

      <button class="btn-cancel" onclick="updateStatus(${order.id}, 'cancelled')">
        ❌ Cancelar
      </button>
    `;

    container.appendChild(div);
  });
}

// ATUALIZAR STATUS
async function updateStatus(id, status) {
  await fetch("http://localhost:3000/orders/update", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization: localStorage.getItem("token")
    },
    body: JSON.stringify({ id, status })
  });

  loadOrders();
}

// AUTO REFRESH
setInterval(loadOrders, 5000);
</script>

</body>
</html>
