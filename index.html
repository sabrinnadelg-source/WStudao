<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wstudao — Tudo por R$10</title>

<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
  gap:15px;
}

.card {
  background:#fff;
  padding:10px;
  border-radius:8px;
  text-align:center;
}

button {
  padding:8px;
  margin-top:5px;
  cursor:pointer;
}

.cart {
  position:fixed;
  right:10px;
  top:10px;
  background:#fff;
  padding:15px;
  border-radius:8px;
  width:250px;
}
</style>
</head>
<body>

<h1>🛒 Wstudao — Tudo por R$10</h1>

<div class="grid" id="grid"></div>

<!-- CARRINHO -->
<div class="cart">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>

  <p><b>Total:</b> R$ <span id="total">0</span></p>

  <input id="nome" placeholder="Nome"><br><br>
  <input id="email" placeholder="Email"><br><br>
  <input id="telefone" placeholder="Telefone"><br><br>
  <input id="endereco" placeholder="Endereço"><br><br>

  <button onclick="checkout()">Finalizar compra</button>
</div>

<script>
// PRODUTOS
const PRODUTOS = [
  { id:1, nome:"Canetas Coloridas", cost:6, url:"https://shopee.com.br" },
  { id:2, nome:"Esponja Maquiagem", cost:5, url:"https://mercadolivre.com.br" },
  { id:3, nome:"Suporte Celular", cost:7, url:"https://amazon.com.br" }
];

let cart = [];

// RENDER
function render() {
  const grid = document.getElementById("grid");

  PRODUTOS.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${p.nome}</h3>
      <p>R$ 10</p>
      <button onclick="add(${p.id})">Adicionar</button>
    `;

    grid.appendChild(div);
  });
}

// ADD
function add(id) {
  const p = PRODUTOS.find(x => x.id === id);

  const item = cart.find(x => x.id === id);

  if (item) item.qty++;
  else cart.push({ ...p, qty:1 });

  updateCart();
}

// UPDATE CART
function updateCart() {
  const div = document.getElementById("cartItems");
  div.innerHTML = "";

  let total = 0;

  cart.forEach(i => {
    total += 10 * i.qty;

    div.innerHTML += `
      <p>${i.nome} (${i.qty}x)</p>
    `;
  });

  document.getElementById("total").innerText = total;
}

// CHECKOUT REAL
async function checkout() {
  if (cart.length === 0) {
    alert("Carrinho vazio");
    return;
  }

  const customer = {
    nome: document.getElementById("nome").value,
    email: document.getElementById("email").value,
    telefone: document.getElementById("telefone").value,
    endereco: document.getElementById("endereco").value
  };

  if (!customer.nome || !customer.endereco) {
    alert("Preencha os dados");
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/checkout", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ customer, cart })
    });

    const data = await res.json();

    window.location.href = data.checkout_url;

  } catch (err) {
    alert("Erro no pagamento");
  }
}

render();
</script>

</body>
</html>
